<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charting Example - HYDROS Developer Portal</title>
  <script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-1: #0a0a0a;
      --bg-2: #1a1a1a;
      --bg-3: #2a2a2a;
      --color-1: #ffffff;
      --color-2: #b3b3b3;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.15);
      --border: #3a3a3a;
      --success: #00cc66;
      --danger: #ff4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-1);
      color: var(--color-1);
      min-height: 100vh;
    }

    .nav {
      border-bottom: 1px solid var(--border);
      background: var(--bg-1);
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 2rem;
    }
    .nav-logo { display: block; }
    .nav-logo img { height: 30px; width: auto; display: block; }
    @media (max-width: 760px) {
      .nav-logo img { height: 26px; }
    }
    .nav-sep { color: var(--border); }
    .nav-title { color: var(--color-2); font-size: 0.95rem; }

    .screen { display: none; max-width: 960px; margin: 0 auto; padding: 3rem 2rem; }
    .screen.active { display: block; }

    .connect-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      margin: 0 auto;
    }
    .connect-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .connect-card p { color: var(--color-2); font-size: 0.9rem; margin-bottom: 2rem; }

    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: 0.85rem; color: var(--color-2); margin-bottom: 0.4rem; }
    .field input, .field select {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--color-1);
      padding: 0.65rem 0.85rem;
      font-size: 0.9rem;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }

    .btn {
      display: inline-block;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--color-1);
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #001318; font-weight: 600; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-full { width: 100%; }
    .btn.range-active { border-color: var(--accent); background: var(--accent-dim); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 1rem; display: none; }
    .error-msg.visible { display: block; }

    .back-link {
      background: none; border: none; color: var(--color-2);
      font-size: 0.9rem; cursor: pointer; margin-bottom: 1.5rem; padding: 0;
    }
    .back-link:hover { color: var(--accent); }

    .page-header h1 { font-size: 1.4rem; }
    .page-header .subtitle { color: var(--color-2); font-size: 0.85rem; margin-top: 0.25rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0 1rem;
    }
    .plot-toolbar { margin: 0.75rem 0; }
    .toolbar .spacer { flex: 1; }
    .toolbar select {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--color-1);
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
    }

    .chart-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .chart-card + .chart-card { margin-top: 1rem; }
    .sensor-chart { width: 100%; height: 320px; }
    .chart-card h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
    .chart-note { color: var(--color-2); font-size: 0.8rem; margin-top: 0.75rem; }

    #event-panel { margin-top: 1rem; }
    #event-panel h2 { font-size: 1.05rem; margin: 0 0 0.25rem; }
    #event-panel p { color: var(--color-2); font-size: 0.8rem; margin: 0 0 0.75rem; }
    #event-panel table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    #event-panel th, #event-panel td {
      text-align: left;
      padding: 0.45rem 1.25rem 0.45rem 0;
      border-bottom: 1px solid var(--border);
    }
    #event-panel th { color: var(--color-2); font-weight: 600; }
    #event-panel tr:last-child td { border-bottom: none; }

    .picker { position: relative; }
    .picker-panel {
      position: absolute; z-index: 10; top: calc(100% + 6px); left: 0;
      min-width: 280px; max-height: 320px; overflow-y: auto;
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.5rem; display: none;
    }
    .picker-panel.open { display: block; }
    .picker-actions { display: flex; gap: 0.5rem; padding: 0.25rem 0.25rem 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 0.4rem; }
    .picker-actions button { background: none; border: none; color: var(--accent); font-size: 0.8rem; cursor: pointer; padding: 0; }
    .picker-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem; font-size: 0.85rem; cursor: pointer; border-radius: 6px; }
    .picker-row:hover { background: var(--bg-3); }
    .picker-row .series-type { color: var(--color-2); font-size: 0.75rem; margin-left: auto; }
    .picker-row.disabled { opacity: 0.4; cursor: default; }
    .picker-row.disabled:hover { background: none; }
    .picker-group {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.25rem 0.2rem; font-size: 0.8rem; font-weight: 600;
      color: var(--color-2); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .picker-group.disabled { opacity: 0.4; }
    .picker-note { color: var(--color-2); font-size: 0.75rem; padding: 0.4rem 0.25rem 0; }

    .code-section { margin-top: 3rem; }
    .code-section h2 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .code-section p { color: var(--color-2); font-size: 0.9rem; margin-bottom: 1rem; }
    pre {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--color-1);
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tok-comment { color: #6a9955; }
    .tok-string { color: #ce9178; }
    .tok-keyword { color: #569cd6; }
    .tok-number { color: #b5cea8; }
    .tok-func { color: #dcdcaa; }
  </style>
</head>

      <code>points.map(([x, y]) =&gt; ({ x, y }))</code> on a time scale, and
      Plotly takes separate <code>x</code> and <code>y</code> arrays. Each
      series carries a <code>type</code> field (<code>Tmp</code>,
      <code>pH</code>, …) identifying the unit; this page charts one unit
      type at a time so all series share a y-axis. Values arrive in fixed
      canonical units (<code>Tmp</code> °C, <code>ORP</code> mV,
      <code>Sal</code> PSU, <code>Flo</code> LPH - full table in the API
      reference) regardless of the controller's display setting; convert
      client-side if you need °F or other units.
    </p>
  </div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let baseUrl = '';
let providerKey = '';
let deviceKey = '';
const charts = {};
const CHART_TYPES = [
  { type: 'Tmp', id: 'chart-temp' },
  { type: 'pH', id: 'chart-ph' },
  { type: 'ORP', id: 'chart-orp' },
];
const plotStates = Object.fromEntries(CHART_TYPES.map(({ type }) => [type, {
  rangeHours: 2160,
  response: null,
  seriesList: [],
  selectedNames: new Set(),
  requestVersion: 0,
  discoveryVersion: 0,
  selectionInitialized: false,
}]));

// ── API ────────────────────────────────────────────────────────────────────
function apiFetch(path) {
  return fetch(baseUrl + path, {
    headers: { 'Authorization': `${providerKey}:${deviceKey}` },
  });
}

function queryParams(type) {
  const state = plotStates[type];
  const card = document.querySelector(`.plot-card[data-type="${type}"]`);
  const end = Date.now();
  const params = new URLSearchParams({ start: String(end - state.rangeHours * 3600000), end: String(end),
    resolution: card.querySelector('.resolution-select').value });
  if (state.selectedNames.size) params.set('name', [...state.selectedNames].join(','));
  return params;
}

// Canonical logged units by firmware type - values arrive in these units
// regardless of the controller's display preference (see the API docs).
const UNITS = { Tmp: '\u00b0C', pH: 'pH', ORP: 'mV', DKH: 'dKH', Sal: 'PSU', Flo: 'LPH' };
function unitLabel(type) {
  return UNITS[type] ? `${type} (${UNITS[type]})` : type;
}

// ── Series discovery ───────────────────────────────────────────────────────
const STALE_MS = 7 * 24 * 3600000;

async function loadSeries(type) {
  const state = plotStates[type];
  const card = document.querySelector(`.plot-card[data-type="${type}"]`);
  const resolution = card.querySelector('.resolution-select').value;
  const version = ++state.discoveryVersion;
  try {
    const res = await apiFetch(`/api/v1/device/logs/series?resolution=${resolution}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    if (version !== state.discoveryVersion || card.querySelector('.resolution-select').value !== resolution) return;
    state.seriesList = body.series.filter(series => series.type === type && Date.now() - series.lastSeen <= STALE_MS);
  } catch (err) {
    if (version !== state.discoveryVersion) return;
    state.seriesList = [];
    state.selectedNames.clear();
    state.response = null;
    state.requestVersion++;
    clearCharts(type);
    renderSensorPicker(type);
    renderEventPanel();
    showPlotError(type, `Failed to load sensors: ${err.message}`);
    return false;
  }
  const names = new Set(state.seriesList.map(series => series.name));
  if (!state.selectionInitialized) {
    state.selectedNames = new Set(names);
    state.selectionInitialized = true;
  } else {
    state.selectedNames = new Set([...state.selectedNames].filter(name => names.has(name)));
  }
  renderSensorPicker(type);
  return true;
}

function renderSensorPicker(type) {
  const state = plotStates[type];
  const card = document.querySelector(`.plot-card[data-type="${type}"]`);
  const button = card.querySelector('.sensor-button');
  const rows = card.querySelector('.sensor-rows');
  rows.replaceChildren();
  if (!state.seriesList.length) {
    button.textContent = 'Sensors (0)';
    return;
  }
  button.textContent = `Sensors (${state.selectedNames.size}/${state.seriesList.length})`;

  for (const series of state.seriesList) {
    const row = document.createElement('label');
    row.className = 'picker-row';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = state.selectedNames.has(series.name);
    box.addEventListener('change', () => {
      if (box.checked) state.selectedNames.add(series.name); else state.selectedNames.delete(series.name);
      renderSensorPicker(type);
      refreshPlot(type);
    });
    const name = document.createElement('span');
    name.className = 'series-name';
    name.textContent = series.name;
    row.append(box, name);
    rows.appendChild(row);
  }
}

async function loadSensorData(type) {
  const res = await apiFetch(`/api/v1/device/logs?${queryParams(type)}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Rendering ──────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showError(elementId, message) {
  const el = document.getElementById(elementId);
  el.textContent = message;
  el.classList.add('visible');
}

function clearError(elementId) {
  const el = document.getElementById(elementId);
  el.textContent = '';
  el.classList.remove('visible');
}

function clearCharts(type) {
  if (type) {
    if (charts[type]) charts[type].clear();
    return;
  }
  for (const chart of Object.values(charts)) chart.clear();
}

function showPlotError(type, message) {
  const el = document.querySelector(`.plot-card[data-type="${type}"] .plot-error`);
  el.textContent = message;
  el.classList.add('visible');
}

function clearPlotError(type) {
  const el = document.querySelector(`.plot-card[data-type="${type}"] .plot-error`);
  el.textContent = '';
  el.classList.remove('visible');
}

function renderEventPanel() {
  const details = CHART_TYPES.flatMap(({ type }) => {
    const response = plotStates[type].response;
    if (!response) return [];
    return Object.entries(response.series)
      .flatMap(([name, sensor]) => sensor.points
        .filter(point => sensor.sensorType !== 'analog' || point[2])
        .map(point => ({ name, point })));
  }).sort((a, b) => b.point[0] - a.point[0]).slice(0, 200);
  document.getElementById('event-panel').hidden = !details.length;
  const tbody = document.getElementById('event-rows');
  tbody.replaceChildren();
  for (const { name, point } of details) {
    const tr = document.createElement('tr');
    for (const value of [new Date(point[0]).toISOString(), name, point[1], point[2]]) {
      const td = document.createElement('td'); td.textContent = String(value); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

function renderChart(type) {
  const state = plotStates[type];
  const chartConfig = CHART_TYPES.find(item => item.type === type);
  const data = state.response;
  const series = Object.entries(data.series)
    .map(([name, sensor]) => ({ name, type: sensor.sensorType === 'event' ? 'scatter' : 'line',
      step: ['bool', 'enum'].includes(sensor.sensorType) ? 'end' : false,
      showSymbol: sensor.sensorType !== 'analog', data: sensor.points.map(([time, value]) => [time, value]) }));

  charts[type] = charts[type] || echarts.init(document.getElementById(chartConfig.id), 'dark');
  charts[type].clear();
  charts[type].setOption({
    backgroundColor: 'transparent',
    xAxis: { type: 'time' },
    yAxis: { type: 'value', scale: true, name: unitLabel(type) },
    tooltip: { trigger: 'axis' },
    legend: { top: 0 },
    grid: { top: 40, right: 20, bottom: 30, left: 50 },
    series,
  });
  document.querySelector(`.plot-card[data-type="${type}"] .plot-summary`).textContent =
    `${data.points} points · ${data.resolution}`;
  renderEventPanel();
}

async function refreshPlot(type) {
  const state = plotStates[type];
  const card = document.querySelector(`.plot-card[data-type="${type}"]`);
  const version = ++state.requestVersion;
  clearPlotError(type);
  if (state.selectedNames.size === 0) {
    state.response = null;
    clearCharts(type);
    card.querySelector('.plot-summary').textContent = 'Select sensors for this plot.';
    renderEventPanel();
    return;
  }
  if (state.selectedNames.size > 100) {
    showPlotError(type, 'Pick at most 100 sensors (the name filter limit).');
    return;
  }
  try {
    const response = await loadSensorData(type);
    if (version !== state.requestVersion) return;
    state.response = response;
    if (Object.keys(response.series).length === 0) {
      clearCharts(type);
      card.querySelector('.plot-summary').textContent = `${response.points} points · ${response.resolution}`;
      showPlotError(type, 'No retained data for this range, resolution, and sensor selection.');
      renderEventPanel();
      return;
    }
    renderChart(type);
  } catch (err) {
    if (version !== state.requestVersion) return;
    state.response = null;
    clearCharts(type);
    renderEventPanel();
    showPlotError(type, 'Failed to load log data: ' + err.message);
  }
}

function initializePlotControls() {
  const template = document.getElementById('plot-controls-template');
  for (const { type } of CHART_TYPES) {
    const card = document.querySelector(`.plot-card[data-type="${type}"]`);
    card.querySelector('.plot-controls').append(template.content.cloneNode(true));
    renderSensorPicker(type);

    for (const button of card.querySelectorAll('.range-btn')) {
      button.addEventListener('click', () => {
        plotStates[type].rangeHours = Number(button.dataset.hours);
        card.querySelectorAll('.range-btn').forEach(item => item.classList.toggle('range-active', item === button));
        refreshPlot(type);
      });
    }
    card.querySelector('.resolution-select').addEventListener('change', async () => {
      plotStates[type].requestVersion++;
      if (await loadSeries(type)) refreshPlot(type);
    });
    card.querySelector('.sensor-button').addEventListener('click', () => {
      const panel = card.querySelector('.picker-panel');
      const open = panel.classList.toggle('open');
      card.querySelector('.sensor-button').setAttribute('aria-expanded', String(open));
    });
    card.querySelector('.clear-sensors').addEventListener('click', () => {
      plotStates[type].selectedNames.clear();
      renderSensorPicker(type);
      refreshPlot(type);
    });
    card.querySelector('.select-all-sensors').addEventListener('click', () => {
      plotStates[type].selectedNames = new Set(plotStates[type].seriesList.map(series => series.name));
      renderSensorPicker(type);
      refreshPlot(type);
    });
    card.querySelector('.refresh-btn').addEventListener('click', () => refreshPlot(type));
    card.querySelector('.export-btn').addEventListener('click', async event => {
      clearPlotError(type);
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const params = queryParams(type);
        params.set('format', card.querySelector('.export-format').value);
        params.set('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);
        const res = await apiFetch(`/api/v1/device/logs/export?${params}`);
        const body = await res.json();
        if (!res.ok) throw new Error(body.message || `HTTP ${res.status}`);
        window.location.href = body.url;
      } catch (err) {
        showPlotError(type, 'Export failed: ' + err.message);
      } finally {
        button.disabled = false;
      }
    });
  }

  document.addEventListener('click', event => {
    if (!event.target.closest('.picker')) {
      for (const card of document.querySelectorAll('.plot-card')) {
        card.querySelector('.picker-panel').classList.remove('open');
        card.querySelector('.sensor-button').setAttribute('aria-expanded', 'false');
      }
    }
  });
}

// ── Events ─────────────────────────────────────────────────────────────────
initializePlotControls();

document.getElementById('form-connect').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError('connect-error');
  baseUrl = document.getElementById('input-base-url').value.trim().replace(/\/+$/, '');
  providerKey = document.getElementById('input-provider-key').value.trim();
  deviceKey = document.getElementById('input-device-key').value.trim();

  // ── SAVE TO BROWSER LOCALSTORAGE ──
  localStorage.setItem('hydros_base_url', baseUrl);
  localStorage.setItem('hydros_provider_key', providerKey);
  localStorage.setItem('hydros_device_key', deviceKey);

  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  try {
    if (new URL(baseUrl).protocol !== 'https:') throw new Error('API Base URL must use HTTPS');
    const res = await apiFetch('/api/v1/device');
    if (!res.ok) throw new Error(res.status === 403 || res.status === 401 ? 'Invalid credentials' : `HTTP ${res.status}`);
    const device = await res.json();
    document.getElementById('device-name').textContent = device.friendlyName || device.deviceId;
    document.getElementById('device-id').textContent = device.deviceId;
    showScreen('screen-chart');
    await Promise.all(CHART_TYPES.map(async ({ type }) => {
      if (await loadSeries(type)) refreshPlot(type);
    }));
  } catch (err) {
    showError('connect-error', err.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('btn-back-connect').addEventListener('click', () => {
  providerKey = '';
  deviceKey = '';
  for (const { type } of CHART_TYPES) {
    const state = plotStates[type];
    state.requestVersion++;
    state.discoveryVersion++;
    state.response = null;
    state.seriesList = [];
    state.selectedNames.clear();
    state.selectionInitialized = false;
    state.rangeHours = 2160;
    const card = document.querySelector(`.plot-card[data-type="${type}"]`);
    card.querySelector('.resolution-select').value = '1d';
    card.querySelectorAll('.range-btn').forEach(button => {
      button.classList.toggle('range-active', button.dataset.hours === '2160');
    });
    renderSensorPicker(type);
  }
  localStorage.removeItem('hydros_base_url');
  localStorage.removeItem('hydros_provider_key');
  localStorage.removeItem('hydros_device_key');
  document.getElementById('input-provider-key').value = '';
  document.getElementById('input-device-key').value = '';
  clearCharts();
  showScreen('screen-connect');
});

window.addEventListener('resize', () => { for (const chart of Object.values(charts)) chart.resize(); });

// ── Example-code syntax colors (tiny tokenizer, no dependencies) ───────────
const JS_KEYWORDS = new Set(['const', 'let', 'var', 'function', 'return', 'await', 'async',
  'new', 'if', 'else', 'for', 'of', 'in', 'typeof', 'class', 'true', 'false', 'null', 'undefined']);
function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
for (const block of document.querySelectorAll('pre code')) {
  const source = block.textContent;
  const pattern = /(\/\/[^\n]*)|(`(?:[^`\\]|\\.)*`|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_$][\w$]*)(?=\s*\()|\b([A-Za-z_$][\w$]*)\b/g;
  let html = '';
  let last = 0;
  for (const m of source.matchAll(pattern)) {
    html += escapeHtml(source.slice(last, m.index));
    const [text, comment, string, number, call, word] = m;
    const cls = comment ? 'tok-comment' : string ? 'tok-string' : number ? 'tok-number'
      : call && !JS_KEYWORDS.has(call) ? 'tok-func'
      : JS_KEYWORDS.has(call || word) ? 'tok-keyword' : null;
    html += cls ? `<span class="${cls}">${escapeHtml(text)}</span>` : escapeHtml(text);
    last = m.index + text.length;
  }
  block.innerHTML = html + escapeHtml(source.slice(last));
}


// ── AUTO-LOGIN ON LOAD ──
window.addEventListener('DOMContentLoaded', () => {
  const savedBase = localStorage.getItem('hydros_base_url');
  const savedProvider = localStorage.getItem('hydros_provider_key');
  const savedDevice = localStorage.getItem('hydros_device_key');

  if (savedBase && savedProvider && savedDevice) {
    document.getElementById('input-base-url').value = savedBase;
    document.getElementById('input-provider-key').value = savedProvider;
    document.getElementById('input-device-key').value = savedDevice;
    
    // Automatically trigger the submit event to log in instantly
    document.getElementById('form-connect').requestSubmit();
  }
});

</script>
